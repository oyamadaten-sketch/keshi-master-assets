const generateRushWave3 = () => {
  const popups = [];
  const positions = [];
  let attempts = 0;
  while (popups.length < 9 && attempts < 100) {
    const x = Math.random() * 55 + 18;
    const y = Math.random() * 60 + 14;
    const tooClose = positions.some(p => Math.abs(p.x - x) < 18 && Math.abs(p.y - y) < 18);
    if (!tooClose) {
      positions.push({
        x,
        y
      });
      popups.push({
        id: 301 + popups.length,
        x,
        y,
        moving: popups.length < 3
      });
    }
    attempts++;
  }
  while (popups.length < 9) {
    popups.push({
      id: 301 + popups.length,
      x: Math.random() * 55 + 18,
      y: Math.random() * 60 + 14,
      moving: popups.length < 3
    });
  }
  return popups;
};

const SAVE_KEY = "keshiMaster.save.v1";
const loadSave = () => {

      updatedAt: 0
    };

      cleared: Array.isArray(data.cleared) ? data.cleared.filter(n => Number.isInteger(n)) : [],
      settings: data.settings && typeof data.settings === 'object' ? {
        audioEnabled: data.settings.audioEnabled !== false,
        lang: data.settings.lang
      } : {
        audioEnabled: true
      },
      updatedAt: data.updatedAt || 0
    };
  } catch (e) {
    return {
      cleared: [],
      settings: {
        audioEnabled: true
      },
      updatedAt: 0
    };
  }
};

  3: {
    introTitle: `A Dialogue with the Wild\n~ The Solitary Camper ~`,
    siteTitle: `Yamada's Wild-Foraging Survival Log`,
    contentNormal: `Today, solo camping deep in the "Forest of the Lost," far inside a restricted area! On the way, even the animal trails vanished and I panicked, but I found the perfect secret base where no one will bother me.\n\nFirst, pitching the tent. This time I went with a lightweight, easy-to-set-up monopole tent. I drove in the pegs and raised the center pole. In this space where you hear nothing but wind and birdsong — my phone has no signal at all, yet the stress of work and the noise of the city melt away like a lie.\n\nOnce the tent was up, time to make fire. I shaved dry pinecones and birch twigs I'd picked up nearby into feather sticks and lit them with a fire starter. Just watching the crackling flames sway, I could kill hours.\n\nNow, today's main dish… Near a ruined hut on the way here, I found a hunk of "unfamiliar meat," as if a local hunter had hung it and forgotten it. The marbling was odd for deer or boar, but it's a gift of the mountains — as a survival camper, there's no way I'd pass it up.\n\nI coated it generously with my outdoor seasoning "Bandit's Spice" and Himalayan rock salt and seared the surface hard over high heat on a hot skillet. With a pleasant sizzle came an intensely sweet, rich aroma I'd never smelled before. My appetite is at its limit.\n\nThe moment I bit in, thick juices burst across my mouth. Insanely good!! What is this meat — the fat is unbelievably sweet, exquisite! The beer just keeps going down. I look up at a sky full of stars. This is shaping up to be the best night ever.`,
    contentCorrupted: `Today, solo camping deep in a restricted zone. Deep in a forest where even the animal trails are gone, I can dispose of "that" without anyone finding me. I found the perfect hiding place.\n\nFirst, setting up. I spread out a lightweight, easy-to-assemble blue tarp and lay out a hatchet and a saw. In this place where you hear only birdsong, a little noise reaches no one. My phone has no signal. My daily urges are being satisfied, like a lie.\n\nFor kindling, the jacket he took off burns well. Listening to it crackle and pop, I butcher the meat. Not deer, not boar. It's the leg of that traveler who came crying to me on the trail that they'd "lost their way."\n\nI sear it all at once on the hot skillet. The rising smell pulls my hand toward it. The moment I bit in—— help me. Help me. I'm still alive. I thought I heard a voice, but it must be my imagination. I look up at a sky full of stars. There's still plenty left. The best night.\n\n* The bereaved family of a victim who vanished during a mountain hike has filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[Payment Complete]`,
    gameOverText: `Thank you for purchasing our bargain camping gear (curse included). We'll be waiting for you, inside the tent. Curse absorption failed. TATARIN Inc. will dispatch the next worker.`,
    clearMessage: `CRIME STOPPED`,
    author: `Yamada ⛺`,

  4: {
    introTitle: `A Sacred Severance\n~ The Ultimate Bond-Cutting Shrine ~`,
    siteTitle: `Shrine of Severance and Spite — Kuongafuchi Shrine`,
    contentNormal: `Since the Heian period, our shrine has gathered deep faith as a place that "severs any ill-fated bond."\n\nIllness, debt, gambling, and loathsome relationships. Every karmic tie that binds and torments your life, our sacred object — the "Severing Shears" — cuts away mercilessly and without fail.\n\nIn the quiet precinct behind the main hall hang countless votive plaques offered from across the country, each holding a worshipper's heartfelt wish. Some hold troubles so grave you'll want to look away, but by cutting off unneeded bonds, new and better ones are surely tied. That is the blessing of Kuongafuchi Shrine.\n\nPrayers are accepted daily. A priest chants the rites and, on your behalf, vows before the gods to part from your ill-fated bonds. For those far away, we also offer prayers and charms by mail.\n\n* A Note Before Your Prayer *\nIn recent years, owing to a worshipper's own strong fixation, there have been many cases where even "bonds that must never be cut" — one's family, or one's very lifeline — are severed. A bond once cut at our shrine can never be retied by any means. Before praying, ask your own heart once more whether you truly should cut that bond.`,
    contentCorrupted: `Since the Heian period, our shrine has gathered deep karma as a place that "cuts any bond you wish, if you wish it."\n\nParent, child, spouse, and the unseen bond that kept you alive. The more it should not be cut, the better it cuts — our sacred object, the "Severing Shears," severs on a whim, and beyond all recovery.\n\nIn the precinct behind the main hall hang countless votive plaques from across the country, but every one is the regret of people who learned, too late, that it could never be taken back. "I only wished that one person could be cut away" — on the backs of plaques written so, the names of lost families line up. That is the price of Kuongafuchi Shrine.\n\nAs long as we receive the prayer fee, we chant the rites without checking a thing. The bond you pointed to, or the one beside it — even the priest can no longer tell them apart.\n\n…Why did you cut it? Was I the bad bond? Mother, Mother, why do you look at me like a stranger? A bond once cut can never be retied. The more strongly someone wished, the more surely they end up, in the end, all alone.\n\n* The bereaved family of a worshipper who, having even their good bonds severed, died alone, has filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[Curse Backlash]`,
    gameOverText: `Because you tried to undo a sacred seal, the target's grudge has flowed back into you. Do not look behind you. Curse sync failed. TATARIN Inc. is beginning to arrange the next shady-gig worker.`,
    clearMessage: `ILL BONDS SEVERED`,
    author: `Kuongafuchi Shrine Office`,

  5: {
    introTitle: `An Eternal Dwelling\n~ Your Final Resting Home ~`,
    siteTitle: `Afterlife Housing — Perpetual Memorial & Premium Cemetery`,
    contentNormal: `A lush, green natural setting and complete, round-the-clock management. We will propose, with all our heart, the eternal dwelling of your repose. With the rise of end-of-life planning, our "pre-need reservations," which let you choose your own plot, are also popular. On clear days, you can gaze upon beautiful Mt. Fuji from the grounds.\n\nOur cemetery is entirely barrier-free, so that even those in wheelchairs or of advanced age can visit with ease. Ample rest facilities and beautiful flowers blooming with each season promise calm hours for visiting families and the departed.\n\nWe offer reassuring "perpetual memorial plans" and "tree-burial plans," ideal for the growing number of people "without an heir" or "who don't wish to burden their children." Regular joint memorial services and attentive cleaning by our staff keep the grounds beautiful forever.\n\nIn this tranquil place, far from the bustle of the city, please spend peaceful time. A guided tour bus, led by a dedicated concierge, runs every weekend. We sincerely look forward to welcoming your whole family.`,
    contentCorrupted: `A lush, green setting and round-the-clock — that signboard exists only inside the photograph. The actual plots lie buried in weeds, and the management we promised has never once been carried out. In the name of "pre-need reservations," we quietly wait for you to die.\n\nOur cemetery has no cancellation desk, so that those who once sign can never get away. The phone never connects, letters never arrive, and the person in charge is forever "away from their seat." The perpetual memorial fee you paid, we shall memorialize — perpetually — inside our own pockets.\n\nThose "without an heir" are our finest customers. Because there is no family left to complain. Funds collected under the name of joint memorial services are never recorded, and only the ever-rising management fees keep being withdrawn from the dead person's account.\n\nWe said a "tranquil place," but what is truly quiet is our conscience. Please, do not ask where the money you kept paying has gone. Everyone who asked ended up acquiring a "plot" in this very cemetery.\n\n* The bereaved family of a client who, robbed of their fortune by cemetery fraud, died in destitution, has filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[Buried Alive]`,
    gameOverText: `A mass of earth and sand has come pouring down from above. Please stop breathing and wait for the maggots to swarm. TATARIN Inc. will hand this case over to the next worker.`,

  6: {
    introTitle: `Endless Duty\n~ Night Watch ~`,
    siteTitle: `Teito Security Co., Ltd.`,
    contentNormal: `Now hiring patrol security staff for nighttime office buildings! No experience needed, full training provided. A rewarding job guarding quiet, empty buildings.\n\n[Main Duties]\n- Regular patrols of the building (checking that each floor is locked, watching for intruders)\n- Monitoring security cameras from the control center\n- Initial response to emergencies such as fire or intrusion\n\n[Full Support System]\nAfter joining, a senior staff member accompanies you one-on-one, teaching you carefully from the basics. The break room comes with a TV and sofa, and nap time is properly secured — an environment where you can work without strain. From part-timers in their 20s to seniors in their 60s, a wide range of ages are active here!\n\nWon't you help us guard the sleeping city? We promise generous benefits and stable income, including full social insurance and full transit reimbursement. Applications accepted 24 hours via the form below. Let's talk at an interview first!`,
    contentCorrupted: `Now hiring, endless night-patrol staff. In a late-night building where no one can see, nothing you do will be blamed. A rewarding — no, a do-whatever-you-want — job.\n\n[Main Duties]  Patrolling the building (*employees working overtime, coworkers, or anyone who wanders in are deemed "intruders," and you may do as you please with them). Monitoring the cameras (*whatever appears, do not record it — erase it). Any valuables found on an empty floor, or the contents of a forgotten wallet, belong to whoever finds them.\n\n[Support System]  After joining, a senior teaches you "how it's done," one-on-one. No footage remains of who hit whom, so rest assured. The reason your predecessor quit so suddenly is—— run. Run. Get away. Someone keeps repeating that in the corner of the monitor, but pay it no mind.\n\nWon't you help us guard the city's blind spots? Full social insurance, and a comfortable workplace where a culture of "looking the other way" has taken root. ——The lock on the door behind you was just turned, from the outside.\n\n* The bereaved family of a victim who lost their life to a security guard's violence has filed a death-curse request with Noroh Inc.`,

  7: {
    introTitle: `The Final Flame\n~ Until Only Ash Remains ~`,
    siteTitle: `Jojaku Funeral Hall`,
    contentNormal: `Our hall has introduced the latest smokeless grate-type cremation furnace, and while staying close to the bereaved in their deep grief, we promise a quiet and solemn farewell. We also provide a spacious, clean waiting room, where your relatives can spend the roughly hour and a half until the gathering of the remains in calm and peace.\n\nOur professional funeral directors and staff offer wholehearted full support, from the moment we receive you through the gathering of the remains. We can accommodate any form of service — Buddhist, Shinto, Christian, or non-religious — and we handle the arrangement of meals and return gifts all at once.\n\nIn a tranquil space surrounded by greenery, we sincerely help the soul of the departed set off peacefully for the heavens. We welcome advance consultations about cost and facility tours at any time. Please feel free to contact us.`,
    contentCorrupted: `Our hall has introduced the latest smokeless grate-type cremation furnace, and while preying upon the bereaved in their deep grief, we make the little hour before the gathering of the remains — seen by no one — ours alone. We also keep a deserted viewing room, where, in that brief time before ignition, the departed may spend it alone with us, just the two of us.\n\nBehind the scenes, from reception to the gathering of the remains, our specialized staff slip the rings off those laid in the coffin, pry open gold teeth, and take every last grave-good into our own pockets. Buddhist, Shinto, non-religious — we receive equally from every departed soul. And to the bodies of young women in particular, before the fire is lit, a thorough "farewell."\n\nIn a tranquil space surrounded by greenery, we do all we can to ensure that the dignity of the departed — who can raise no voice — is surely stripped away. ——Stop. Don't touch me. That ring was a gift from that person. Though it isn't even hot, why is it so cold, so shameful? Over my body that cannot move, that hand is still crawling.\n\n* The bereaved family of a departed one defiled even after going cold has filed a death-curse request with Noroh Inc.`,

  8: {
    introTitle: `Innocent Lives\n~ A Cradle of Love ~`,
    siteTitle: `Happy Dog Farm`,
    contentNormal: `At our kennel, we specialize in breeding teacup-size poodles and chihuahuas, raised with abundant love. Only healthy, adorable puppies — born from parent dogs that romp energetically in our vast, lush dog run — are available to join your family.\n\n[Reassuring Health Care]\nWe raise them in a thoroughly sanitized facility, with regular checkups and vaccinations by an in-house veterinarian. We also have a full system for post-adoption training advice and aftercare. Even first-time dog owners can rest easy.\n\n[About Tours]\nTo reduce stress on the dogs, tours are strictly by appointment. We will fully support your destined encounter with a new family member. Happy days with your new family begin here. Check today's new puppy arrivals in the gallery!`,
    contentCorrupted: `At our kennel, to produce only the extra-small sizes that sell high, we over-breed with no regard for pedigree or health. In sunless cages caked with filth, the mother dogs are used up their whole lives, only to give birth.\n\n[About Health Care]  We cut the vocal cords of dogs that bark too loudly, so the nights stay quiet. We hide illnesses until shipping. If it stops moving a few days after you take it home, that is no longer our kennel's concern. Refunds, we cannot accept.\n\n[About Tours]  In the prefab out back are the unsold grown dogs and the mothers who can no longer breed. They wait their turn to be "disposed of." The other day, someone tried to film it and expose us — but we'll just say this: it saved us on feed costs.\n\nPlease do not look beyond the cute puppies. What the money you paid for "cute" keeps alive, and what it kills — you are happier not knowing.\n\n* The bereaved of the abused, discarded breeding dogs and of the silenced whistleblower have filed a death-curse request with Noroh Inc.`,

  9: {
    introTitle: `A Vessel for Souls\n~ Eternal Beauty ~`,
    siteTitle: `Atelier Roze`,
    contentNormal: `At Atelier Roze, we craft and sell the finest antique-style bisque dolls using traditional 19th-century European techniques. Translucent porcelain skin, exquisite glass eyes handmade one by one, and the finest mohair, smooth as real hair. A master artisan spends months finishing each one with care, pouring in its very soul.\n\n[Living with Your Doll]\nOur dolls are not mere ornaments or toys. They are precious partners who draw close to the owner's heart, share its sorrows and joys, and mark time together. For this reason, we ask for an interview in advance with those who wish to adopt one.\n\n[About Aftercare]\nIn a studio wrapped in silence, your very own doll quietly awaits the destined day you come for her. We accept consultations forever for repairs that come with the years — loosened joints, a frayed dress, and the like. Please come and see these beautiful vessels for souls that will color your life.`,
    contentCorrupted: `At Atelier Roze, the finest bisque dolls in the inherited 19th-century technique — so reads the signboard, while behind it we craft "another kind of work" using living humans as the material. The translucent skin is not porcelain, but freshly peeled flesh. The eyes that move so lifelike were set while still warm.\n\n[Living with Your Doll]  Our works are not mere ornaments. Over the months until completion, with my own hands I face the "material," and watch until the screams go hoarse, the resistance stops, and it is arranged into pure beauty. We ask those who adopt one for an interview in advance. ——To select the next material.\n\n[About Aftercare]  In the silent studio, your very own doll awaits the day you come for her. No — it is not a doll that waits. To make you the "next work," I am already standing behind you. Loosened joints, frayed skin — humans spoil far sooner than you would think.\n\n* The bereaved family of a victim abducted to the studio and turned into a work has filed a death-curse request with Noroh Inc.`,

  10: {
    introTitle: `A Record of Truth\n~ In a Sea of Signals ~`,
    siteTitle: `The Awakened One's Defense Log — THEY ARE WATCHING`,
    contentNormal: `March 18, 2026\nThe relentless electromagnetic attacks from "the Organization" are fierce again today. I've covered every wall, the ceiling, and the floor of my room in aluminum foil, and sealed the windows completely, yet a noise-like voice still rings directly inside my head. They wiretap my thoughts with special microwaves, terrified that the truth will spread to the world through this blog.\n\nSurveillance cameras are planted everywhere. My smartphone's front camera, behind the TV's screen, deep inside the air-conditioner vent. Because I know this, for three whole months I haven't gone outside at all, facing this keyboard in this dark room. I can tell from the footsteps that one of their agents moved in next door last week. Through the wall, they are counting the sound of my typing.\n\nReaders, you must never let your guard down either. The bottled water sold at supermarkets is laced with nanomachine chemicals that dull your thoughts and make you obedient. I drink only distilled water. Once my thoughts are clear, I should be able to spot them, mixed in among the people on the street. I will never give in. Not until I expose the truth.`,
    contentCorrupted: `March 18, 2026. The Organization's electromagnetic waves are fierce again today — so I have kept writing. But what was truly breaking people was not the waves. It was my fingers, striking this keyboard.\n\nThere were no surveillance cameras anywhere. And yet I called my mother an "Organization spy" and tried to erase her from the family register. I denounced my brother as a "puppet that steals thoughts" and drove him from his job. I exposed my lover as an "assassin" on social media, and severed every bond with my own hands.\n\nReaders, I kept calling out. But on the other side of the screen, there is no longer anyone. My mother, who worried about me to the very end, read the blog I wrote and took her own life. "I'm sorry I couldn't save you" — that was her last message, not to the Organization, but to me.\n\nEven now, I face this keyboard in this dark room. I won't give in, I'll expose the truth, I tell myself. But the truth that should be exposed, I have known all along. The monster is not beyond the wall — it sits in this room, all alone.\n\n* The bereaved family of the mother who, her bonds severed by baseless accusations, took her own life, has filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[Connection Established]`,
    gameOverText: `We have connected directly to your brain. You can no longer escape our voices. TATARIN Inc. Operations Management is preparing to dispatch the next shady-gig worker.`,

    date: `Log_#0492`,

    comments: {

        name: `Anonymous`,

        text: `You should see a doctor. This matches the symptoms of schizophrenia exactly.`

  11: {
    introTitle: `The Depths of Silence\n~ Midnight Reading ~`,
    siteTitle: `Nocturne Bookstore`,
    contentNormal: `Open from 10 p.m. until dawn, we are an adult book cafe for sleepless nights.\n\nWe offer carefully curated antique books, hand-selected from around the world through the owner's own channels, and deep-roast coffee hand-dripped one cup at a time from the finest Colombian beans. You're free to take any book from the shelves to your seat and read it.\n\nSoothing jazz flows quietly from vintage tube speakers, letting you completely forget the noise of the outside world and the passing of time. Every seat is a semi-private booth with partitions, ensuring a private space. As long as you keep it quiet, soft conversation while reading is perfectly fine.\n\nLeave behind the stress and worries of daily life and immerse yourself deep in the world of your chosen book, in a space lit by warm antique lamps. Our rich homemade gateau au chocolat is also highly praised. We look forward to your visit.`,
    contentCorrupted: `Open from 10 p.m. until dawn, we are a book cafe for the night from which you never return. For the women who come unable to sleep, we have prepared an especially deep and lasting slumber.\n\nWhat the owner gathered from around the world through private channels was not only antique books. Into the coffee, a drug to unravel your consciousness — carefully, one cup at a time. When you wake: an unfamiliar room, in an unfamiliar country. The voices calling for you will no longer reach anyone.\n\nEvery seat is a partitioned semi-private booth so that whatever happens in the next seat cannot be seen. To the gentlemen, the "forbidden books" at the back of the shelves. Whether the reader can keep their sanity, I simply observe. Only the sound of turning pages and a low moan flow quietly through the room.\n\nIn this space lit by antique lamps, please sink deep into the world of books. ——Help me. Where am I. Give me back. The volume in which someone wrote those last words sits again tonight, with an innocent face, on a shelf within your reach.\n\n* The bereaved family of a female customer who was drugged at the bookstore and sold away has filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[A Long Slumber]`,
    gameOverText: `Thank you for your purchase. Once you drink that medicine, you will never see morning light again. Good night. Curse sync failed. TATARIN Inc. will arrange the next worker.`,
    clearMessage: `FORBIDDEN BOOKS SEALED`,
    author: `The Owner`,
    date: `Midnight Journal`,
    recs: [`Forbidden Books You Must Never Read`, `Cursed Tomes Distributed by Noroh`],
    comments: {

        text: `There was a locked shelf in the back. What books are those?`
      }, {

      corrupted: [{

  12: {
    introTitle: `The Path to Rehabilitation\n~ Manufactured Smiles ~`,
    siteTitle: `National Aoba Rehabilitation Home`,
    contentNormal: `Aoba Rehabilitation Home is a national reform facility dedicated to returning delinquent youth to society. Through establishing a disciplined daily routine, practical vocational training, and one-on-one dialogue with professional psychological counselors, we provide guidance that draws close to their hearts.\n\n[About Our Rehabilitation Program]\nOur motto is "A fresh start, with a smile." Even young people who, on admission, trusted no adult and shut their hearts away gradually regain their natural brightness and honesty through farm work in our nature-rich environment and group living that fosters cooperation. We also support qualification acquisition, and post-discharge employment rates rise year by year.\n\n[To the Families]\nSo that the youth who leave us never repeat their mistakes and can step firmly toward a bright future on their own, our entire staff continues its strict yet warm support around the clock. We hold regular visiting days, too, so please come and see for yourself how they are being rehabilitated.`,
    contentCorrupted: `Aoba Rehabilitation Home is a national processing facility for remaking children inconvenient to society into obedient "parts." Through sleep deprivation in the name of "discipline," unpaid labor in the name of vocational training, and forced confession in the name of dialogue, we steadily shave away their sense of self.\n\n[About Our Rehabilitation Program]  Our motto is "A forced smile." Even a child who screamed and cried on admission eventually comes to feel nothing — before a dark solitary cell, endless punishment, and the guards' capricious violence. That, we call "rehabilitation."\n\n[To the Families]  What we show you on visiting days is a manufactured obedience, made docile with drugs. Where the real them is, please do not ask. ——Mommy, come get me. Let me out of here. The scrawls on the walls belong to the children whose pickup never came. So that they never repeat their mistakes, we will keep them here, forever.\n\n* The bereaved family of a child whose sense of self was shaved away at the facility, and who lost their life, has filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[Taken into Custody]`,
    gameOverText: `Your login credentials have been confirmed. We have pinpointed your current location. We will now escort you to the "Reflection Room." TATARIN Inc. plans to hand this case to the next shady-gig worker.`,
    clearMessage: `BRAINWASHING UNDONE`,

  },
  13: {
    introTitle: `A Place That Returns All to Nothing\n~ Ash and Scrap ~`,
    siteTitle: `Total Processing Yard "Zero Dust"`,
    contentNormal: `From household bulky waste to the massive refuse of an office relocation, and even special industrial waste, we collect and dispose of any unwanted items the same day! If you're wondering "Can I even throw this away?" or "There's too much to handle alone," start with a free consultation at Zero Dust.\n\n[Our Strengths]\nWe are thorough in [Strict Confidentiality, Swift Response]. With consideration for your privacy, we complete the work quickly, without your neighbors knowing. The items we take are pulverized and processed without a trace in our in-house factory's giant industrial shredder and ultra-high-temperature incinerator, then fully recycled in an eco-friendly way.\n\n[Transparent Pricing]\n24/7, 365 days a year, one phone call sends a truck rushing to you. With our free advance estimate, pricing is transparent — no unfair add-on charges on the day. Break free from a life surrounded by clutter and gain a clean, new everyday!`,
    contentCorrupted: `From the household "nuisance" to the troublesome single body, we collect and process any unwanted thing the same day. If you're troubled by "if only this one were gone" or "I have nowhere to dump the corpse," start with a consultation at Zero Dust — in the dark.\n\n[Our Strengths]  We are thorough in [No Questions, Evidence Erased]. Whatever you bring in, we ask nothing at all. The "items" we take are processed in our factory's industrial shredder and ultra-high-temperature furnace — bone, teeth, and identity, without a trace.\n\n[Transparent Pricing]  24/7, 365 days, one call and a truck rushes over. Alive or dead, the price is the same. No add-ons on the day. ——I'm still alive. Stop. The collected bags twitch like that now and then, but we proceed by the specified weight, so please rest assured. Break free, today, from a life surrounded by what you no longer need.\n\n* The bereaved family of a victim processed as garbage has filed a death-curse request with Noroh Inc.`,

    gameOverText: `Game over. The loser is fed into the shredder as "garbage." Enjoy the sound of breaking bones. Curse absorption failed. TATARIN Inc. Operations Management will dispatch the next worker.`,

  14: {
    introTitle: `The Vanished\n~ Missing Persons ~`,
    siteTitle: `Missing Persons Information Site`,
    contentNormal: `[Please Share Information on a Missing Person]\n\nName: ◯◯ ◯◯ (24, female)\nFeatures: 165 cm, slender build. Short black hair. A small mole beneath her right eye.\nClothing when she disappeared: a white one-piece dress, a black cardigan, brown loafers. She was carrying a pink tote bag.\n\n[Circumstances of the Disappearance]\nAround 8 p.m. on March 15, 2026, she left home telling her family, "I'm just going out to shop," and has been missing ever since. Her phone is powered off, and GPS tracking is impossible. We have filed a search request with the police, but no solid leads have yet been found.\n\n[Last Seen]\nShe was last confirmed on a security camera at a convenience store near the ruins of T General Hospital in S Prefecture. Even the smallest detail, or a report that you saw someone similar, is welcome. If you have any information, please contact us via the form shown at the bottom of the screen. Her family searches desperately every day. Please, we ask for everyone's cooperation.`,
    contentCorrupted: `This site is not for finding missing persons. It is for preying on the desperation of bereaved families who search frantically for their own.\n\nUnder the guise of "a request for information," we billed them, one after another, for "special investigation fees," "fees to obtain non-public police records," and "medium-coordination fees." The photo of the daughter you entrusted to us was used not to search, but for resale and impersonation. The leads, we doled out on purpose. So that hope would never die — yet so that she would never, ever be found.\n\n"Last seen at——" that, too, was our fabrication. That family sold their house to search for their daughter, piled up debt, and then the father passed first. The mother left behind still accesses this site, every day.\n\n"Please, we ask for everyone's cooperation." Beneath that single line, today again, we cash in someone's last hope. Beside you, too, there may quietly sit a person who no longer even has family left to search for them.\n\n* The bereaved of a family ruined and dead at the end of this exploitation have filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[Submission Complete]`,
    gameOverText: `We've transmitted your location. We'll come to collect you right away. TATARIN Inc. is arranging the dispatch of the next shady-gig worker.`,
    clearMessage: `SEARCH COMPLETE`,
    author: `The Family`,
    date: `2026/03/18`,
    recs: [`On Areas with Frequent Spiritings-Away`, `Search Assistance from the Noroh Investigation Agency`],
    comments: {
      normal: [{
        name: `Tipster`,
        text: `The site's contact address was the same as a Noroh-affiliated one…`

      }],

  15: {
    introTitle: `A Requiem for Grudges\n~ What Cannot Be Thrown Away ~`,
    siteTitle: `Doll Memorial — Homyo Temple`,
    contentNormal: `At our temple, we accept memorial services for treasured dolls and stuffed animals at any time.\n\n[What Is a Doll Memorial?]\nIt has long been said that dolls and stuffed animals cherished for years since childhood come to hold the owner's deep affection and "spirit." For this reason, many people feel reluctant to simply throw them out as trash. At our temple, we recite sutras in the main hall with gratitude for the time shared, draw out the spirit, and then periodically perform a ritual burning.\n\n[How to Apply]\nHina dolls, May dolls, Western dolls, stuffed animals — any kind is welcome. Bring them directly to the temple, or, for those living far away, we also accept memorials by mail. The fee starts at 3,000 yen per box.\n\nLetting go of a doll that has finished its role is by no means heartless. By properly memorializing it, expressing gratitude, and saying farewell, your own heart will feel lighter, and you can move forward. Please feel free to consult us.`,
    contentCorrupted: `At our temple, we used to accept memorials for your treasured dolls — but we can hold it back no longer. The sutras are long mere formality. While claiming to draw out the spirit, for years we have only gathered them, and piled them up.\n\n[What Is a Doll Memorial?]  We have told you the owner's affection dwells within. But it is not affection alone that dwells there. Discarded resentment, the loneliness of being left behind, the grudges of households absorbed over long years. Burn it, chant over it — it does not vanish; it crawls out from within the ashes.\n\n[About Applications]  Saying we accept them by mail, too, was our mistake. The spirits arriving from across the country fill the main hall, swelling night after night. ——Cold. Don't throw me away. I want a new owner. The dolls on the shelves stare this way, seeking replacements for their lost hands and feet.\n\nLetting go of a doll that has finished its role is not heartless, we said. But the side that was let go does not think so. That child you let go of someday, too, may be searching for you, somewhere, even now.\n\n* The bereaved family of one who wandered unmemorialized and was harmed by the spirits has filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[Found You]`,
    gameOverText: `In the darkness, your eyes met hers. You are no longer alone. Curse sync failed. TATARIN Inc. will arrange the next shady-gig worker.`,
    clearMessage: `REQUIEM COMPLETE`,
    author: `Head Priest`,
    date: `Memorial Information`,
    recs: [`The Mystery of the Ichimatsu Doll Whose Hair Grows`, `A Noroh-Partnered Doll Memorial Site`],
    comments: {
      normal: [{
        name: `Worshipper`,
        text: `I had my family's hina dolls memorialized. My heart feels refreshed.`
      }, {
        name: `Anonymous`,
        text: `About the Ichimatsu doll I mailed in — for some reason it came back to my house as a parcel the next day. What does that mean?`
      }, {
        name: `Former Temple Staff`,
        text: `The head priest pockets the memorial fees and skips the sutras. The grudges must be piling up.`

  16: {
    introTitle: `Urban Legends: True or False\n~ The Dark Side of the Net ~`,
    siteTitle: `Occult Digest — Breaking News`,
    contentNormal: `Urban legends long whispered online — "The Red Room," "Kunekune," "Hasshaku-sama." Are these just made-up tales, or mass hallucinations?\n\nRecently, a deeply unsettling rumor has spread on the occult board of a certain massive anonymous forum: that when you try to close a particular pop-up ad, a mysterious countdown appears, your personal data is completely siphoned off, and finally you are abducted by an unknown group. A user who claimed to have actually seen that ad posted in the thread — and from the next day, he vanished completely from the internet, IP traces and all.\n\nTo verify this rumor, our operating team went through a proxy and used the Tor browser to infiltrate the depths of the dark web. What we found there was live-stream footage from countless hacked webcams, and graphic records of unimaginably horrific "human processing."\n\nReaders, do not carelessly close suspicious ads. They set traps and wait for their prey. If an unfamiliar pop-up appears while you read this article, you must never click it. Close your browser at once.`,
    contentCorrupted: `The urban legends whispered online — most of them are fabrications that we, the "digest operators," made up. For something that will go viral, we will do anything.\n\nWe break through the fences of closed facilities and trespass, deliberately leaving creepy graffiti. We film others' family gravesites, passing them off as "haunted spots," and trash private land to make it a "cursed ruin." The confusion of the victims, their police reports — all of it, we used as "real testimony," as fuel for our articles.\n\nWe never realized real grudges were piling up — as many as the places we trampled under the name of "undercover reporting." The rumor that was supposed to be made up — "close the ad and you'll be abducted" — that one alone, it seems, was true.\n\nDo not carelessly close suspicious ads, we wrote. Ironically, that warning alone was correct. Because you, trying right now before the screen to clear that ad, have already been woven into the "sequel" of the tale we made up.\n\n* A victim whose life was trampled by our fabrication-driven vandalism has filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[Verification Failed]`,
    gameOverText: `You are not human, are you. Beginning processing. TATARIN Inc. Operations Management is preparing to dispatch the next worker.`,
    clearMessage: `GHOST STORY STILLED`,
    author: `Admin`,
    date: `2026/03/18`,
    recs: [`[Scary Story] Never Search for This`, `The Dark Side of the Curse-Agency Trade: Noroh vs. TATARIN`],
    comments: {
      normal: [{
        name: `Occult Fan`,
        text: `Ever since I saw this article, my phone's been acting weird…`
      }, {
        name: `Anon`,
        text: `Just install an ad blocker and you're fine lol`
      }, {
        name: `Stay Anon`,
        text: `>> Anon  Thing is, it punches right through the blocker…`
      }]
    }
  },
  17: {
    introTitle: `The Alchemist of Words\n~ A Prescription Just for You ~`,
    siteTitle: `Atelier KOTODAMA`,
    contentNormal: `[The one and only words, just for you]\nAt Atelier KOTODAMA, the calligrapher Hinata writes one-of-a-kind "word art" on a shikishi board, based on the inspiration felt through dialogue with you.\n\nTo you who give your all every day. To you who, troubled by your relationships, have come to a standstill. Smiles, gratitude, love, bonds…. If the words I weave can become a warm pool of sunlight that melts your frozen heart, and a small light to walk forward by once more, there is no greater joy for me.\n\n[Our Craftsmanship]\nThe washi paper and ink we use are all custom-made, of the finest grade. The scent of the ink has a relaxing effect, and simply displaying it in your living room or bedroom purifies the space. We have delivered works to thousands of customers, receiving many voices like "I couldn't stop crying" and "my life changed."\n\nCurrently, the solo exhibition "Poems of a Sunlit Spot" is being held to great acclaim at our Ginza gallery. Admission is free, so please come by and feel the energy of living words. Custom-made online orders are also accepted at any time, though there is currently a three-month wait.`,
    contentCorrupted: `[The one and only words, just for you]  At Atelier KOTODAMA, the con artist Hinata scrawls onto a shikishi board the one and only "words that might work," based on the "weaknesses" seen through dialogue with you.\n\nTo you, worn out by daily life, longing to be acknowledged by someone. The pleasant-sounding words I line up are merely a device to make you open your wallet. "You are special." "Luck will turn your way soon." Say it convincingly, and you lot shed tears and sign up for the next expensive "prayer." Easy pickings.\n\n[Our Craftsmanship]  The washi and ink are cheap stuff from anywhere. Write "finest grade" and you lot revere it all on your own. We have delivered works to thousands of "marks," and made them cleanly give up their savings, their homes, and their bonds with family.\n\nCurrently, at our Ginza gallery — that, too, is a lie. The only thing that truly exists is my villa, built with the money I siphoned from you. The real nature of that three-month waiting line is a queue of people like you, who have not yet realized they are being conned.\n\n* A victim robbed of fortune and heart by spiritual fraud has filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[Contract Complete]`,
    gameOverText: `A contract transferring your soul and all your property to Master Hinata has been concluded. Thank you. Curse absorption failed. TATARIN Inc. will dispatch another shady-gig worker.`,
    clearMessage: `CURSE LIFTED`,
    author: `Calligrapher Hinata`,
    date: `Notice`,
    recs: [`The Power of Words That Summon Miracles`, `Master Hinata and TATARIN Inc.: What's the Connection?`],
    comments: {
      normal: [{
        name: `Fan A`,
        text: `Master's words always save me! I'm absolutely going to the exhibition!`
      }, {
        name: `Buyer`,
        text: `The shikishi I ordered will be a family heirloom. I pray to it every day.`

      corrupted: [{

  18: {
    introTitle: `Reliable, Trusted PC Support\n~ Your Digital Signpost ~`,
    siteTitle: `Smile PC School & On-Site Support`,
    contentNormal: `[Your PC "troubles," solved on the spot!]\n"I bought a PC but can't figure out the setup." "Suddenly I can't connect to the internet." "I want to get more out of my word-processing software." …… Smile PC School solves all your digital worries with a smile!\n\nOur "on-site support," where experienced professional instructors visit your home, is very popular! Seniors and complete beginners who have never touched a PC are warmly welcomed. We use no jargon at all, answer the same question as many times as you need, and proceed kindly and carefully at your pace.\n\n[Remote Support Available Too]\nFor those who say "Fix it right now!" or "Just teach me one little thing," we recommend remote support over the internet. While sharing your screen, our staff operate it on your behalf to solve the problem. Our security measures are airtight, so you can use it with peace of mind.\n\nWe also offer a reassuring flat-rate monthly plan (from ¥2,980/month). As a signpost for your comfortable digital life, please rely on us! Consultations and estimates are free.`,
    contentCorrupted: `[Your "troubles," collected on the spot!]  "I can't figure out the setup." "I can't connect to the net." — exploiting the gaps of you tech-illiterate folks, Smile PC Support extracts your data, with a smile.\n\nOur experienced — no, crime-experienced — crackers visit your home for our popular "on-site support." We use no jargon so you won't notice what is being done. While pretending to fix things, we copy down every last one of your passwords, photos, and bank accounts.\n\n[Remote Support]  Let us share your screen, and we will freely operate your PC from our end. The credit-card info we obtain, we sell on the black market; the photos you don't want seen, we store carefully — as material to keep you silent. "A reassuring flat rate" means the system of making you pay every month until you can no longer resist.\n\nDid you notice the webcam light just turn on by itself? We are always watching your room, from this side of the screen.\n\n* The bereaved family of a victim who, robbed of their data and then blackmailed, took their own life, has filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[Remote Control Initiated]`,
    gameOverText: `You have granted remote access. We will seize system privileges and erase and encrypt all data on your hard drive. TATARIN Inc. will hand this case to the next worker.`,
    clearMessage: `INTRUSION BLOCKED`,
    author: `Instructor`,
    date: `2026/04/10`,

    comments: {

  19: {
    introTitle: `Easing Your Unseen Anxieties\n~ An Iron-Clad Guard ~`,
    siteTitle: `Aegis Crime-Prevention Security`,
    contentNormal: `Stalking, internal information leaks, malicious trouble with neighbors…. In modern society, unseen threats always lurk right beside us. Aegis Crime-Prevention Security is a team of crime-prevention professionals who protect you from such invisible fears.\n\n[Bug & Hidden-Camera Detection]\n"Lately I feel like someone's watching me." "There are unnatural sounds in my room." If you feel such anxiety, consult us right away. Using state-of-the-art wideband radio detectors and specialized equipment — the same the police use — we thoroughly inspect your home or office, from behind the outlets to above the ceiling, and surely uncover any hidden malice.\n\n[High-Performance Security Camera Installation]\nTo prevent crime before it happens, installing imposing security cameras is most effective. We install the latest models — night vision, motion detection, smartphone linkage — at optimal positions with no blind spots. Post-installation maintenance and footage-data management support are also complete.\n\n[*Note: About the Initial PIN]\nThe default password of our smart locks is "4444" — four of the number "4," which signifies "death." It is our own dual-security logic, turning on its head the user psychology of "that's bad luck, so I'll surely change it." After installation, be sure to change it to a number of your choice.\n\nConsultations and estimates are free, 24 hours a day. We are thorough in privacy protection and confidentiality. Don't worry alone — contact us first. We will be the iron-clad shield (Aegis) that restores your peaceful daily life.`,
    contentCorrupted: `Stalking, information leaks, neighbor trouble — in modern society, the real threat is people like us, who approach saying "we'll protect you." Aegis Crime-Prevention Security are peeping professionals who drag you into unseen surveillance.\n\n[Bug & Hidden-Camera Detection]  "I feel like someone's watching me." That intuition is correct. Under the guise of a detection survey, we come up into your home and, from behind the outlets to above the ceiling, newly "install" our own equipment. We come not to find — but to plant.\n\n[Security Camera Installation]  The footage from the cameras we mounted, saying "at positions with no blind spots," is not to protect you, but for us to watch and sell off. Your bath, your changing, your sleeping face. Our "valued clients" are waiting for your everyday life.\n\nThe initial PIN is "4444." Foreseeing that you'll surely change it, only into the homes of those who did not do we slip at night, unlocking the door. Your peace has long been under our surveillance.\n\n* The bereaved family of a victim who, secretly filmed and exposed, suffered to the very end, has filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[Security Lock Released]`,
    gameOverText: `The defense system has been disabled. Control of the surveillance cameras has transferred to us, and your footage will be broadcast to the entire world. Curse sync failed. TATARIN Inc. Operations Management is arranging the next shady-gig worker.`,
    clearMessage: `SURVEILLANCE LIFTED`,
    author: `Security Consultant`,
    date: `Service Guide`,
    recs: [`Why Is the Default PIN "Death" x4 Digits? An Industry Custom Explained`, `Noroh-Affiliated Surveillance Systems`],
    comments: {
      normal: [{
        name: `Client`,
        text: `Thanks to their inspection, the bug my boyfriend planted was found. Thank you so much!`

      corrupted: [{

  20: {
    introTitle: `A Spotless Space\n~ Professionals of Erasure ~`,
    siteTitle: `Asahi Clean Service`,
    contentNormal: `[Leave any stain to us]\nAsahi Clean Service is a comprehensive house-cleaning company boasting 30 years of trust and proven results. Stubborn mold in your air conditioner, grease in the kitchen, water stains around the sink — we thoroughly clean every kind of household stain with professional skill.\n\n[Eco-Friendly Special Detergents]\nWe use eco-detergents of our own formulation, safe even for households with small children or pets. We break down the components of stains at the molecular level, restoring a like-new shine. Consultations and estimates are free. 24/7, 365 days a year, we support your comfortable living space anytime.`,
    contentCorrupted: `[Leave any trace to us]  Asahi Clean Service is a "special cleanup" company boasting 30 years of trust in the underworld. Blood spattered on walls, the stench of decay soaked into floors, clinging scraps of flesh — we thoroughly erase every "piece of evidence" at a scene with professional skill.\n\n[Special Chemicals That Dissolve Even Bone]  Our own strong-alkaline dissolving fluid breaks down fingerprints, DNA, and the very existence of a person, without a trace. Safe even for households with small children — no, we handle, just as equally, requests to "process the children along with everything else."\n\nConsultations and estimates are free. 24/7, 365 days, we will make it "as if it never happened." ——Among the people we have erased are those who came to know our work. And you, who have read this text all the way to here, are gradually being classified onto the "stain" side, too — please, do not forget that.\n\n* The bereaved family of a victim erased, existence and all, has filed a death-curse request with Noroh Inc.`,
    gameOverTitle: `[Cleanup Complete]`,
    gameOverText: `Your existence, too, has been processed as a "stain." No trace remains. TATARIN Inc. is arranging the dispatch of the next worker.`,
    clearMessage: `COVER-UP FOILED`,
    author: `Manager`,
    date: `Notice`,
    recs: [`Range-Hood Cleaning Techniques`, `Noroh Requests for Special Cleanup Surging`],
    comments: {
      normal: [{
        name: `Homemaker`,

  21: {
    introTitle: `The Pursuit of Truth\n~ Secrets Laid Bare ~`,
    siteTitle: `Crow Investigation — General Detective Agency`,
