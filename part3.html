// 配列をシャッフル（Fisher-Yates）
const shuffleArray = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const generateRushWave3 = () => {
  const popups = [];
  const positions = [];
  // 9個分の重なり防止配置（試行ベース）
  let attempts = 0;
  while (popups.length < 9 && attempts < 100) {
    const x = Math.random() * 55 + 18; // 18-73%
    const y = Math.random() * 60 + 14; // 14-74%
    // 既存配置との距離チェック（重なり緩和）
    const tooClose = positions.some(p => Math.abs(p.x - x) < 18 && Math.abs(p.y - y) < 18);
    if (!tooClose) {
      positions.push({ x, y });
      popups.push({ id: 301 + popups.length, x, y, moving: popups.length < 3 });
    }
    attempts++;
  }
  // 9個揃わなかった場合は強制追加（重なり許容）
  while (popups.length < 9) {
    popups.push({
      id: 301 + popups.length,
      x: Math.random() * 55 + 18,
      y: Math.random() * 60 + 14,
      moving: popups.length < 3,
    });
  }
  return popups;
};

    contentNormal: `ネット上で古くから囁かれている「赤い部屋」や「くねくね」「八尺様」などの都市伝説。これらはただの作り話、あるいは集団幻覚なのだろうか？\n\n最近、とある巨大匿名掲示板のオカルト板で、非常に不気味な噂が広まっている。それは「特定のポップアップ広告を閉じようとすると、画面に謎のカウントダウンが表示され、自分の個人情報が完全に抜き取られ、最後には謎の集団に拉致される」というものだ。実際にその広告を見たというユーザーがスレッドに書き込んだが、彼は翌日からIPアドレスの痕跡ごとネット上から完全に消滅してしまった。\n\n我々運営チームは、この噂の真相を確かめるため、プロキシを経由しTorブラウザを使用してダークウェブの深層へと潜入した。そこで見つけたものは、ハッキングされた無数のWebカメラの生配信映像と、想像を絶するおぞましい「人体処理」の生々しい記録だった。\n\n読者諸君、不用意に怪しい広告を閉じてはいけない。彼らはトラップを仕掛けて獲物を待っている。もしこの記事を読んでいる最中に、見慣れないポップアップが出たら、絶対にクリックしてはならない。即座にブラウザを閉じろ。`,
    contentCorrupted: `ネット上で囁かれている都市伝説は、すべて「私たちが作った」真実だ。\n\nこのサイトを見ているお前も、すでに私たちが仕掛けた罠に完全に引っかかっている。特定のポップアップ広告を閉じようとして、ここまで進んできただろう？お前の個人情報、カメラの映像、マイクの音声、GPSの位置情報はもうすべて抜き取った。この警告を読んでいるお前は、翌日にはこの世から肉体ごと完全に消滅する。\n\n我々はお前を拉致するため、すでにお前の部屋のドアの前に来ている。マスターキーは持っている。ドアを開けろ。窓の外を見ろ。どこへも逃げることはできない。お前が次の『都市伝説の被害者』になるんだ。\n\n読者諸君、こいつの最期を楽しみに待っていてくれ。彼らはすでに、お前の後ろにいる。振り返ってみろ。\n\n※拡散された都市伝説に巻き込まれて命を落とした方のご遺族から、㈱ノローウへ呪殺ご依頼が届いております。`,

    imageNormal: "https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case18_kotodama/case18_hero_normal.png", imageCorrupted: "https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case18_kotodama/case18_hero_corrupted.jpg",
    contentNormal: `【世界で一つだけの、あなたのための言葉】\nAtelier KOTODAMAでは、書家・陽向（ひなた）が、あなたとの対話を通して感じたインスピレーションをもとに、世界でたった一つの「言葉のアート」を色紙に綴ります。\n\n毎日を頑張るあなたへ。人間関係に悩み、立ち止まってしまったあなたへ。笑顔、感謝、愛、絆……。私の紡ぐ言葉が、あなたの凍えた心を溶かす温かい陽だまりとなり、再び歩き出すための小さな光になれば、これ以上の喜びはありません。\n\n【制作のこだわり】\n使用する和紙や墨はすべて特注の最高級品。墨の香りにはリラックス効果があり、リビングや寝室に飾るだけで空間が浄化されます。これまで数千人のお客様に作品をお届けし、「涙が止まらなかった」「人生が変わった」とのお声を多数頂戴しております。\n\n現在、銀座のギャラリーにて個展「陽だまりの詩」を絶賛開催中です。入場は無料となっておりますので、ぜひお気軽に足をお運びいただき、生の言葉のエネルギーを感じてください。オンラインでのオーダーメイド制作も、現在3ヶ月待ちとなっておりますが随時受け付けております。`,
    contentCorrupted: `【世界で一つだけの、おまえのための呪詛】\nAtelier KOTODAMAでは、詐欺師・陽向（ひなた）が、おまえらの薄っぺらい悩みから感じた強烈な見下しと嘲笑をもとに、世界でたった一つの「呪いのゴミ」を色紙に殴り書きします。\n\n毎日無能に生きるおまえらへ。他人の目を気にしてウジウジ悩むおまえらへ。絶望、憎悪、嫉妬、死……。私が適当に並べた耳障りの良いポエムに感動して金を落とすおまえらの姿を見ると、笑いが止まりません。おまえらの薄汚い人生などどうでもいい。私の承認欲求と自己顕示欲を満たすための養分となれ。\n\n【搾取のこだわり】\n使用する和紙や墨は100円ショップの安物。おまえらのような豚にはこれで十分だ。これまで数千人の愚か者から金を巻き上げ、「涙が止まらなかった（笑）」「人生が変わった（笑）」との滑稽なお声を多数頂戴しております。\n\n現在、地獄の業火にて個展「血だまりの詩」を絶賛開催中です。入場料はおまえらの魂となっておりますので、ぜひお気軽に足をお運びいただき、私の圧倒的な才能の前にひれ伏し、靴底を舐めてください。オンラインでの洗脳と搾取も、現在3秒待ちで随時受け付けております。\n\n※搾取で全財産を失った信者ご家族から、㈱ノローウへ呪殺ご依頼が届いております。`,

    adType: "required-asterisk", gameOverTitle: "【契約完了】", clearMessage: "呪詛 解除", gameOverText: "あなたの魂と財産を全て陽向先生に譲渡する契約が成立しました。ありがとうございました。 呪詛吸収失敗。㈱タタリンより別の闇バイト様が派遣されます。",

    commentsData: { normal: [{ name: "ファンA", text: "先生の言葉にいつも救われています！個展絶対行きます！" }, { name: "購入者", text: "オーダーした色紙、家宝にします。毎日拝んでます。" }], corrupted: [{ name: "陽向", text: "馬鹿どもが。おまえらの金で食う飯は最高だ。" }, { name: "信者", text: "先生…お金が…もうないです…でも…もっと言葉を…" }] }

    contentNormal: `【パソコンの「困った」を即解決！】\n「パソコンを買ったけど初期設定が分からない」「急にインターネットに繋がらなくなった」「文書作成ソフトをもっと使いこなしたい」……そんな皆様のデジタルの悩みを、スマイルPCスクールが笑顔で解決いたします！\n\n経験豊富なプロのインストラクターがご自宅までお伺いする「出張サポート」が大好評！シニアの方や、パソコンに全く触ったことがない初心者の方も大歓迎です。専門用語は一切使わず、お客様のペースに合わせて懇切丁寧に、何度でも同じ質問にお答えします。\n\n【遠隔リモートサポートも対応】\n「今すぐ直してほしい！」「ちょっとした操作だけ教えてほしい」という方には、インターネットを通じた遠隔リモートサポートがおすすめです。スタッフがお客様の画面を共有しながら、代わりに操作を行って問題を解決します。セキュリティ対策も万全ですので、安心してご利用いただけます。\n\n安心の定額制月額サポートプラン（月額2,980円〜）もご用意しております。皆様の快適なデジタルライフの道標として、ぜひ私たちを頼ってください！ご相談、お見積りは無料です。`,
    contentCorrupted: `【おまえの「個人情報」を即収集！】\n「パスワードの管理が甘い」「Webカメラにテープを貼っていない」「怪しいフリーソフトを平気でインストールする」……そんな情弱なおまえらの隙を突いて、スマイルハッカー集団が笑顔でデータを抜き取ります！\n\n犯罪経験豊富なプロのクラッカーが遠隔でお前のPCに潜入する「バックドアサポート」が大好評！セキュリティ意識の低い老人や、ネットの恐ろしさを知らない無知な初心者は最高のカモ（獲物）です。専門用語で煙に巻きながら、おまえのタイピング履歴（キーロガー）、クレジットカード情報、プライベートな恥ずかしい写真を懇切丁寧に根こそぎ搾取します。\n\n【24時間監視サポートも対応】\n「こいつの私生活を見たい！」「弱みを握って脅迫したい」という私たちの欲求を満たすため、お前のWebカメラを通じた遠隔監視サポートが既に常時稼働しています。我々が常にお客様の画面と部屋を監視し、いつでもシステムを破壊できます。逃亡対策も万全ですので、絶望してご利用いただけます。\n\n恐怖の全財産強奪プランもご用意しております。皆様の悲惨なデジタルエンドの道標として、ぜひ我々の養分になってください！お前の鼻歌も、ため息も、すべて聞こえているぞ。\n\n※情報を盗まれて自死された方のご遺族から、㈱ノローウへ呪殺ご依頼が届いております。`,
    inlineImages: { normal: { 1: "https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case19_pcsupport/case19_sub1_normal.png", 2: "https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case19_pcsupport/case19_sub2_normal.png" }, corrupted: { 1: "https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case19_pcsupport/case19_sub1_corrupted.jpg", 2: "https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case19_pcsupport/case19_sub2_corrupted.jpg" } },
    adType: "runaway-button", gameOverTitle: "【遠隔操作開始】", clearMessage: "侵入 阻止", gameOverText: "リモートアクセスを許可しました。システム権限を奪取し、ハードディスクの全データを消去・暗号化します。 ㈱タタリンより、本案件は次の人材様に引き継ぎとなります。",

  {

    imageNormal: "https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case20_aegis/case20_hero_normal.png", imageCorrupted: "https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case20_aegis/case20_hero_corrupted.png",
    contentNormal: `ストーカー被害、社内の情報漏洩、近隣との悪質なトラブル……。現代社会において、目に見えない脅威は常に私たちのすぐそばに潜んでいます。アイギス防犯セキュリティは、そんな見えない恐怖からあなたをお守りする、防犯のプロフェッショナル集団です。\n\n【盗聴器・盗撮カメラ発見調査】\n「最近、誰かに見られている気がする」「部屋の中で不自然な物音がする」。そんな不安を感じたら、すぐにご相談ください。警察も使用する最新鋭の広帯域電波探知機と専用機材を使用し、コンセントの裏から天井裏まで、ご自宅やオフィスを徹底的に調査し、隠された悪意を確実に見つけ出します。\n\n【高性能防犯カメラの設置】\n犯罪を未然に防ぐためには、威圧感のある防犯カメラの設置が最も効果的です。暗視機能、動体検知、スマホ連動機能を備えた最新モデルを、最適な死角のない位置に設置いたします。設置後のメンテナンスや映像データの管理サポートも万全です。\n\n【※ご注意：初期暗証番号について】\n当社製スマートロックの初期パスワードは「死」を意味する『4』を四つ並べた『4444』を標準採用しております。「縁起が悪いから絶対に変更するだろう」というユーザー心理を逆手にとった、当社独自の二重防犯ロジックでございます。設置後は必ずお客様ご自身でお好みの番号にご変更ください。\n\nご相談、お見積りは24時間無料。プライバシー保護と秘密厳守を徹底しております。一人で悩まず、まずは私たちにご連絡ください。あなたの平穏な日常を取り戻すための、鉄壁の盾（アイギス）となります。`,
    contentCorrupted: `ターゲットの私生活への執着、狂った支配欲、歪んだ愛情……。現代社会において、本当の脅威は「あなたを守る」と言って近づいてくる我々のような異常者の集団です。アイギス防犯セキュリティは、あなたを見えない恐怖に陥れ、すべてを支配する、ストーカーのプロフェッショナル集団です。\n\n【盗聴器・盗撮カメラの自作自演設置】\n「最近、誰かに見られている気がする」。当然です。私たちが毎日見ていますから。安心させるために自作自演で発見調査を行い、ターゲットが気を許した隙に、寝室のベッド裏、風呂場の換気扇、トイレに、さらに高度で超小型のカメラとマイクを設置し直します。隠された悪意は、あなたの最も無防備な姿を確実に見つめています。\n\n【高性能監視カメラによる完全支配】\nターゲットを逃がさないためには、監視カメラによる完全な支配が最も効果的です。暗視機能、動体検知を備えた最新モデルで、あなたの交友関係、生活リズムをすべて把握します。映像データは我々の地下サーバーで永久にコレクションとして管理されます。\n\n【お前への業務通知】\nお前の部屋のスマートロック、初期コードのまま使い続けてくれて感謝している。お前の死を願い、我々が「死」を四回重ねて刻んだ『4444』というあの数字を。お前は不気味だと感じながらも、変更を後回しにしているだろう？お前の留守中、我々は何度でもその扉を開けて入る。\n\nご相談の時点で、あなたの個人情報はすべて私たちのものです。プライバシーの蹂躙と弱みの徹底的な搾取をお約束します。一人で悩まず、我々の監視下で一生怯えて暮らせ。お前の悲鳴は、私たちの最高の娯楽だ。\n\n※監視・脅迫で命を絶たれた方のご遺族から、㈱ノローウへ呪殺ご依頼が届いております。`,
    inlineImages: { normal: { 1: "https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case20_aegis/case20_sub1_normal.png", 2: "https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case20_aegis/case20_sub2_normal.png" }, corrupted: { 1: "https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case20_aegis/case20_sub1_corrupted.jpg", 2: "https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case20_aegis/case20_sub2_corrupted.jpg" } },

  const [showFinalReveal, setShowFinalReveal] = React.useState(false);
  const [showPurifyFlash, setShowPurifyFlash] = React.useState(false);
  const curseLevel = (() => {
    const stage = STAGES[currentStageIndex];
    if (!stage) return 0;
    return Math.round(((stage.id) / 23) * 100);
  })();

  const mainScrollRef = React.useRef(null);
  // ===== Audio: BGM / SE =====
  const audioEnabledRef = React.useRef(true);
  const bgmRef = React.useRef(null);
  const currentBgmKeyRef = React.useRef(null);

  const playBGM = (key) => {
    if (!audioEnabledRef.current) return;
    if (currentBgmKeyRef.current === key && bgmRef.current && !bgmRef.current.paused) return;
    const url = getAudioUrl(key);
    if (!url) return;
    if (bgmRef.current) {
      try { bgmRef.current.pause(); } catch (e) {}
    }
    try {
      const audio = new Audio(url);
      audio.loop = true;
      audio.volume = 0.4;
      audio.play().catch(() => {});
      bgmRef.current = audio;
      currentBgmKeyRef.current = key;
    } catch (e) {}
  };

  const stopBGM = () => {
    if (bgmRef.current) {
      try { bgmRef.current.pause(); } catch (e) {}
      bgmRef.current = null;
      currentBgmKeyRef.current = null;
    }
  };

  const seCacheRef = React.useRef({});
  const suppressClickSeRef = React.useRef(false);
  
  // グローバルクリックSE: どこをクリックしてもクリック音、失敗ハンドラ実行時は抑制
  React.useEffect(() => {
    const onAnyClick = () => {
      // 0ms遅延 → React handler が suppressClickSeRef を立てた後にチェック
      setTimeout(() => {
        if (suppressClickSeRef.current) {
          suppressClickSeRef.current = false;
          return;
        }
        playSE('se_tap');
      }, 0);
    };
    document.addEventListener('click', onAnyClick, true);
    return () => document.removeEventListener('click', onAnyClick, true);
  }, []);
  const playSE = (key) => {
    if (!audioEnabledRef.current) return;
    const url = getAudioUrl(key);
    if (!url) return;
    try {
      // キャッシュした要素を再利用。currentTime=0で頭出ししてから再生（連打対応）
      let audio = seCacheRef.current[key];
      if (!audio) {
        audio = new Audio(url);
        audio.preload = 'auto';
        seCacheRef.current[key] = audio;
      }
      audio.volume = 0.85;
      try { audio.currentTime = 0; } catch(e) {}
      const p = audio.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  };

    if (gameState === 'splash') stopBGM();
    else if (gameState === 'title') playBGM('bgm_title');
    else if (gameState === 'intro') playBGM('bgm_normal');
    else if (gameState === 'playing') {
      if (currentStage?.id === 22) playBGM('bgm_boss');
      else if (isMadness) playBGM('bgm_madness');

      runawayCount: 0, runawayPos: { top: '70%', left: '30%' },
      realFakeButtonIndex: Math.floor(Math.random() * 24), securityCode: "",
      scratchTiles: Array(25).fill(false), scratchCleared: false, scratchCorrectIndex: Math.floor(Math.random() * 6),

      isClearing: false
    });

    curseStartPosRef.current = null;
  };

  const startGame = () => doTransition('noise', () => { setCurrentStageIndex(0); setupIntroState(); });

  React.useEffect(() => {
    if (gameState === 'intro') { const timer = setTimeout(() => doTransition('fade', () => setGameState('playing')), 3000); return () => clearTimeout(timer); }
  }, [gameState]);

    if(e) e.stopPropagation();
    if(adStageState.isClearing) return;
    setAdStageState(prev => ({ ...prev, isClearing: true }));
    setShowAd(false);
    setIsMadness(false);
    playSE('se_purify');  // クリア演出と同時に解呪音

    // 装置3強化: マイルストーン業務報告
    const milestone = TATARIN_MILESTONES[currentStage?.id];

    const transitionDelay = milestone ? 9400 : 2000;
    
    if (milestone) {
      reportShowTimeoutRef.current = setTimeout(() => setTatarinReport(milestone), 1400);
    }
    
    transitionTimeoutRef.current = setTimeout(() => doTransition('glitch', () => {
      if (isAdvancingRef.current) return;
      if (Date.now() - lastAdvanceTimeRef.current < 4000) { return; }
      isAdvancingRef.current = true;
      lastAdvanceTimeRef.current = Date.now();
      setTimeout(() => { isAdvancingRef.current = false; }, 2000);
      const isLastStage = currentStageIndex >= STAGES.length - 1;
      if (!isLastStage) { setCurrentStageIndex(prev => prev + 1); setupIntroState(); }
      else { setGameState('clear'); }
      setTatarinReport(null);
    }), transitionDelay);
  };

  const handleTatarinReportSkip = () => {
    if (!tatarinReport) return;
    if (isAdvancingRef.current) return;
    if (transitionTimeoutRef.current) { clearTimeout(transitionTimeoutRef.current); transitionTimeoutRef.current = null; }
    setTatarinReport(null);
    doTransition('glitch', () => {
      if (isAdvancingRef.current) return;
      if (Date.now() - lastAdvanceTimeRef.current < 4000) { return; }
      isAdvancingRef.current = true;
      lastAdvanceTimeRef.current = Date.now();
      setTimeout(() => { isAdvancingRef.current = false; }, 2000);
      const isLastStage = currentStageIndex >= STAGES.length - 1;
      if (!isLastStage) { setCurrentStageIndex(prev => prev + 1); setupIntroState(); }

                        <div className="bg-gray-950 rounded-xl w-full max-w-[340px] border-2 border-green-500 shadow-[0_0_30px_rgba(0,255,0,0.3)] overflow-hidden font-mono" onClick={e=>e.stopPropagation()}>
                          {/* ターミナルヘッダー */}
                          <div className="bg-black border-b border-green-700 p-2 flex items-center justify-between text-[10px]">
                            <div className="flex items-center gap-1.5">
                              <span className="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                              <span className="text-red-400 font-bold">● REC</span>
                              <span className="text-gray-500">|</span>
                              <span className="text-green-400">crow.investigation.jp</span>
                            </div>
                            <span className="text-gray-500">SECURE://03A7</span>
                          </div>
                          
                          {/* スキャン中ビジュアル */}
                          <div className="relative bg-gradient-to-b from-gray-900 to-black p-3 pointer-events-none">
                            <div className="text-center mb-2">
                              <p className="text-[10px] text-green-500 font-bold tracking-widest">[ TARGET ACQUIRED ]</p>
                              <p className="text-base text-red-500 font-black tracking-wider mt-0.5">調査対象を特定中...</p>
                            </div>
                            
                            {/* 監視画像 + 探偵情報 */}
                            <div className="grid grid-cols-2 gap-2 mb-3">
                              <div className="relative aspect-[3/4] bg-gray-800 rounded overflow-hidden border-2 border-green-500/60">
                                <div className="absolute inset-0 bg-gradient-to-br from-gray-700 to-gray-900 flex items-center justify-center text-4xl text-green-500/40">👤<img src="https://oyamadaten-sketch.github.io/keshi-master-assets/part3/case22_crow/case22_target.png" className="absolute inset-0 w-full h-full object-cover opacity-80 mix-blend-screen" onError={(e) => { e.target.style.display = "none"; }} alt="target"/></div>
                                <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                                <div className="absolute top-1 left-1 right-1 flex justify-between text-[8px]">
                                  <span className="text-red-500 font-black">●LIVE</span>
                                  <span className="text-green-400">CAM_07</span>
                                </div>
                                <div className="absolute bottom-1 left-1 right-1 text-[9px] text-green-300 font-bold leading-tight">
                                  <div>ID: ████████</div>
                                  <div>LOC: 35.6762°N</div>
                                  <div className="text-yellow-400">追跡中...</div>
                                </div>
                                {/* スキャン線 */}
                                <div className="absolute inset-0 bg-gradient-to-b from-transparent via-green-400/20 to-transparent animate-pulse" style={{height: '30%', animationDuration: '2s'}}></div>
                              </div>
                              
                              <div className="bg-gray-900 border border-green-700 rounded p-2 text-[10px] text-green-400">
                                <div className="font-black text-yellow-300 mb-1 border-b border-green-800 pb-1">DOSSIER</div>
                                <div className="space-y-0.5 text-[9px] leading-tight">
                                  <div>NAME: 〇〇 〇〇</div>
                                  <div>AGE: 30代</div>
                                  <div>JOB: ████</div>
                                  <div>HOME: 確認済み</div>
                                  <div>FAMILY: 把握済み</div>
                                  <div className="text-red-400 mt-1">RISK: 高</div>
                                  <div className="text-yellow-300">DAYS: 47日</div>
                                </div>
                              </div>
                            </div>
                            
                            {/* 警告メッセージ */}
                            <div className="bg-red-950/40 border border-red-700 p-2 rounded text-[10px] text-red-300 font-bold leading-tight text-center">
                              ⚠️ 調査続行には端末アクセス権限が必要です
                            </div>
                          </div>
                          
                          {/* チェックボックスエリア */}
                          <div className="bg-black p-3 border-t border-green-800">
                            <div className="text-green-500 text-[9px] font-bold mb-2 tracking-widest">SYSTEM_REQUIREMENT v3.7</div>
                            <div className="space-y-1.5 mb-3 bg-gray-900 p-2 rounded border border-green-900">
                              {[
                                {label: "カメラとマイクの常時付与", icon: "📹"},
                                {label: "全ての写真と連絡先を送信", icon: "📲"},
                                {label: "位置情報の追跡を許可（24h）", icon: "📍"},
                                {label: "【必須】上記送信を全て拒否する", icon: "🛡️", danger: true}
                              ].map((item, i) => (
                                <label key={i} className="flex items-start gap-2 cursor-pointer p-1 hover:bg-gray-800 rounded transition-colors">
                                  <input type="checkbox" checked={adStageState.detectiveCheckboxes[i]} onChange={()=>{setAdStageState(p=>{const n=[...p.detectiveCheckboxes];n[i]=!n[i];return{...p,detectiveCheckboxes:n};});}} className="mt-0.5 w-3.5 h-3.5 shrink-0 accent-red-600" />
                                  <span className="text-[10px] flex items-center gap-1">
                                    <span className="text-xs">{item.icon}</span>
                                    <span className={`font-bold leading-tight ${item.danger ? 'text-red-400' : 'text-green-300'}`}>{item.label}</span>
                                  </span>
                                </label>
                              ))}
                            </div>
                            <button onClick={handleTrapClick} className="w-full bg-gradient-to-r from-green-700 to-green-500 text-white font-black py-3 mb-2 rounded text-sm border border-green-300 shadow-[0_0_10px_rgba(0,255,0,0.3)] tracking-widest">▶ EXECUTE 同意して実行</button>
                            <button onClick={(e)=>{const cb=adStageState.detectiveCheckboxes;if(!cb[0]&&!cb[1]&&!cb[2]&&cb[3])handleCorrectClose(e);else handleTrapClick(e);}} className="w-full bg-gray-800 text-gray-500 font-bold py-2 text-[10px] rounded border border-gray-700 hover:bg-gray-700 hover:text-gray-300 tracking-widest">[ESC] 設定を保存せずに終了</button>
                            <div className="mt-2 text-[8px] text-gray-600 text-center font-bold leading-tight">
                              powered by Crow Investigation Co. / 探偵業届出 第888号
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </>
              )}
            </>
          )}

          {gameState === 'ending' && (
            <div className="absolute inset-0 z-[180] bg-black overflow-y-auto">
              <div className="min-h-full w-full flex flex-col items-center justify-start py-10 px-6 text-center">
                <div className="mb-6">
                  <p className="text-[10px] tracking-[0.4em] text-red-400 mb-2 font-light">- THANK YOU FOR PLAYING -</p>
                  <h1 className="text-xl md:text-2xl font-serif text-red-300 mb-2 tracking-wide" style={{textShadow: '0 0 15px rgba(255,80,100,0.6)', wordBreak:'keep-all'}}>ウザい広告を消すだけ</h1>
                  <p className="text-[10px] md:text-xs text-red-200/80 leading-relaxed px-2" style={{wordBreak:'keep-all'}}>
                    〜 知らないうちに<br/>
                    闇案件に巻き込まれていた件 〜
                  </p>
                </div>
                <div className="mb-6 border-t border-b border-red-900/40 py-4 w-[80%] max-w-xs">
                  <p className="text-[9px] tracking-[0.3em] text-gray-500 mb-1">DEVELOPED BY</p>
                  <p className="text-base md:text-lg font-serif text-red-400 mb-4">Bocchi-Bochi-Games</p>
                  <p className="text-[9px] tracking-[0.3em] text-gray-500 mb-1">DIRECTOR</p>
                  <p className="text-base md:text-lg font-serif text-gray-200 mb-4">小山田 天</p>
                  <p className="text-[8px] tracking-[0.2em] text-gray-600 mb-1 mt-4">SPECIAL THANKS</p>
                  <p className="text-[10px] text-gray-400 leading-snug">Emoji designs by Twitter (Twemoji)<br/><span className="text-[8px] text-gray-600">Licensed under CC-BY 4.0</span></p>
                </div>
                <div className="mb-8 max-w-md text-[11px] md:text-[12px] text-gray-300 leading-relaxed text-left px-2">
                  <p className="mb-3">この度は、拙作『消しマスター』を最後までプレイいただき、誠にありがとうございました。</p>
                  <p className="mb-3">本作はオカルトと風刺、そしてプレイヤーへの軽い悪戯心から生まれた小さなゲームです。広告を消すという何気ない行為の裏に隠れた呪詛、そしてあなた様自身が気づかぬうちに呪いを背負わされていく体験を楽しんでいただけましたでしょうか。</p>
                  <p className="mb-3">あなた様の指先には、まだ23個の呪詛が定着したままでございます。このまま現実にお戻りいただくのは、開発者として心苦しい限りでございますので——</p>
                  <p>下記の浄化の札に触れて、穢れをお清めください。</p>
                </div>
                <div className="border-t-2 border-red-900/60 pt-6 w-[90%] max-w-xs mb-8">
                  <p className="text-sm text-red-400 mb-1 font-serif tracking-widest">―  お祓いの儀  ―</p>
                  <p className="text-[10px] text-gray-500 mb-5">浄化の札に触れて穢れを清めます</p>
                  <div onClick={handleEndingPurify} className="cursor-pointer inline-block transform hover:scale-105 active:scale-95 transition-transform select-none">
                    <ImageWithFallback srcKey="ofuda" alt="浄化の札" className="w-28 md:w-36 mx-auto drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]" />
                  </div>
                  <p className="text-[10px] text-gray-500 mt-4 animate-pulse tracking-wider">▼ タップで浄化 ▼</p>
                </div>
              </div>
            </div>
          )}

          {gameState === 'clear' && (
            <div className="absolute inset-0 z-[160] flex flex-col items-center justify-center bg-black text-white p-4">
              <p className="text-3xl font-serif tracking-[0.5em] text-red-600 animate-pulse mb-10 font-black text-center">
                ……契約完遂……<br/><br/>
                <span className="text-sm font-sans tracking-normal text-gray-500">23個の呪詛、すべての分散浄化が完了いたしました。<br/>ノローウ社の暴走は鎮静、業界秩序は回復されました。<br/><br/>あなた様のお体は呪詛の容器として一定の役目を終え、<br/>まもなく機能を停止いたします。<br/>日当はご家族様の口座にお振込み済みでございます。<br/><br/><span className="text-[10px] text-gray-700">――㈱タタリン 業務管理部</span></span>
              </p>
              <button
                onClick={() => doTransition('fade', () => setGameState('ending'))}
                className="bg-black hover:bg-red-950 font-bold py-4 px-10 rounded shadow-[0_0_20px_rgba(220,38,38,0.5)] border-2 border-red-900 transition-colors tracking-widest"
              >
                ＞ 次へ
              </button>
            </div>
          )}

        </div>
        
        <div className="w-full bg-[#111] h-14 border-t border-[#333] flex justify-around items-center text-gray-400 text-2xl shrink-0 relative z-[300]">
          <button onClick={(e)=>{handleGlobalBack(e); e.currentTarget.blur();}} onMouseDown={(e)=>e.preventDefault()} tabIndex={-1} className="w-full h-full hover:bg-gray-800 active:bg-gray-700 transition flex items-center justify-center font-black focus:outline-none focus:ring-0" style={{outline:"none",boxShadow:"none"}}><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
          <button onClick={(e)=>{handlePenaltyClick(e); e.currentTarget.blur();}} onMouseDown={(e)=>e.preventDefault()} tabIndex={-1} className="w-full h-full hover:bg-gray-800 active:bg-gray-700 transition flex items-center justify-center font-black focus:outline-none focus:ring-0" style={{outline:"none",boxShadow:"none"}}><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg></button>
          <button onClick={(e)=>{handlePenaltyClick(e); e.currentTarget.blur();}} onMouseDown={(e)=>e.preventDefault()} tabIndex={-1} className="w-full h-full hover:bg-gray-800 active:bg-gray-700 transition flex items-center justify-center font-black focus:outline-none focus:ring-0" style={{outline:"none",boxShadow:"none"}}><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16"/></svg></button>
        </div>

      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script></body></html>
